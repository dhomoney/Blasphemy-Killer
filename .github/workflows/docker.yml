name: docker

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: dhomoney/blasphemy-killer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build the amd64 image into the local daemon and smoke it before
      # anything gets published.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          docker run --rm "$IMAGE:smoke" --version
          docker run --rm "$IMAGE:smoke" --list-phrases | grep -q .
          docker run --rm --entrypoint ffmpeg  "$IMAGE:smoke" -version
          docker run --rm --entrypoint ffprobe "$IMAGE:smoke" -version
          docker run --rm --entrypoint deno    "$IMAGE:smoke" --version
          # Privilege drop must land on the requested uid, not root.
          test "$(docker run --rm -e PUID=1234 -e PGID=1234 \
                    --entrypoint sh "$IMAGE:smoke" -c \
                    'setpriv --reuid=1234 --regid=1234 --clear-groups id -u')" = 1234

      - name: Smoke test the web UI
        run: |
          set -eux
          mkdir -p /tmp/bk-media
          docker run -d --name bk-smoke -p 127.0.0.1:8080:8080 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v /tmp/bk-media:/media "$IMAGE:smoke" serve
          for _ in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:8080/api/config && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q "blasphemy-killer"
          curl -sf http://127.0.0.1:8080/static/app.js > /dev/null
          # The media root must not be escapable.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
                  'http://127.0.0.1:8080/api/browse?path=../../etc')" = 400
          # The server itself must not be running as root.
          test "$(docker exec bk-smoke awk '/^Uid:/{print $2}' /proc/1/status)" != 0
          docker rm -f bk-smoke

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Every dependency ships a prebuilt manylinux_2_28 aarch64 wheel, so the
      # arm64 leg compiles nothing and stays cheap under QEMU.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The releases page is filled from CHANGELOG.md: the notes are the section
  # for this tag, verbatim, so they cannot drift from the changelog. Gated on
  # the build job so a release is never announced for a version that failed to
  # publish an image.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Exits non-zero when the version has no section, or an empty one,
          # which fails the tag instead of publishing a release with no notes.
          python3 scripts/changelog_section.py --version "$version" > notes.md

          # "## 2.5.1 — short descriptor" titles the release; a bare heading
          # leaves it named after the tag.
          descriptor="$(python3 scripts/changelog_section.py --version "$version" --title)"
          if [ -n "$descriptor" ]; then
            title="$TAG — $descriptor"
          else
            title="$TAG"
          fi

          # Idempotent, so re-running a tag updates the notes rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md --latest
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md --latest
          fi
