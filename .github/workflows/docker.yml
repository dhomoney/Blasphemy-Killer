name: docker

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: dhomoney/blasphemy-killer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build the amd64 image into the local daemon and smoke it before
      # anything gets published.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          docker run --rm "$IMAGE:smoke" --version
          docker run --rm "$IMAGE:smoke" --list-phrases | grep -q .
          docker run --rm --entrypoint ffmpeg  "$IMAGE:smoke" -version
          docker run --rm --entrypoint ffprobe "$IMAGE:smoke" -version
          docker run --rm --entrypoint deno    "$IMAGE:smoke" --version
          # Privilege drop must land on the requested uid, not root.
          test "$(docker run --rm -e PUID=1234 -e PGID=1234 \
                    --entrypoint sh "$IMAGE:smoke" -c \
                    'setpriv --reuid=1234 --regid=1234 --clear-groups id -u')" = 1234

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Every dependency ships a prebuilt manylinux_2_28 aarch64 wheel, so the
      # arm64 leg compiles nothing and stays cheap under QEMU.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
