name: dockerhub-description

# Keeps the Docker Hub repository overview in step with README.md. Kept out of
# docker.yml so a README edit doesn't drag a full multi-arch image build along.

on:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dhomoney/blasphemy-killer
          readme-filepath: ./README.md
          short-description: "Scan video and audio files for phrases that take the Lord's name in vain and mute them"
