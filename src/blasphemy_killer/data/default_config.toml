# blasphemy-killer default configuration.
# Copy to ~/.config/blasphemy-killer/config.toml (or pass --config) to override.
# User config values replace these; the phrase list is replaced wholesale, not merged.

[detection]
# Padding added around each detected phrase, in milliseconds.
pad_before_ms = 300
pad_after_ms = 300

# Phrases are matched case-insensitively and space-insensitively against the
# transcript ("god damn" also matches "goddamn" and "God-damn,"), always
# anchored to word boundaries ("christ" never matches inside "christmas").
phrases = [
    "god damn",
    "goddamned",
    "god damned",
    "goddam",
    "goddammit",
    "god dammit",
    "goddamnit",
    "god damn it",
    "jesus christ",
    "jesus h christ",
    "jesus fucking christ",
    "oh my god",
    "oh god",
    "my god",
    "good god",
    "god almighty",
    "dear god",
    "thank god",
    "god help",
    "holy christ",
    "sweet jesus",
    "jesus mary and joseph",
    "oh my lord",
    "lord have mercy",
    "swear to god",
    "i swear to god",
    "honest to god",
    "for god's sake",
    "god's sake",
    "for christ's sake",
    "christ's sake",
    "for christ sake",
    "christ almighty",
    "jesus",
    "christ",
    "good lord",
    "oh lord",
    "lord almighty",
]

[transcription]
model = "small"     # tiny | base | small | medium | large-v3 | distil-small.en | ...
language = "en"     # "" = auto-detect
beam_size = 5
# 5.1/7.1 sources: transcribe the center (dialogue) channel plus a little of
# front L/R instead of a flat downmix, so music/effects don't drown speech.
center_channel = true
# Silero VAD gate; lower threshold keeps quieter speech under music (more
# recall, slightly more noise). Set vad_filter = false to transcribe everything.
vad_filter = true
vad_threshold = 0.35
cpu_threads = 0     # 0 = auto

[download]
# Netscape-format cookies.txt handed to yt-dlp for URL downloads (age-gated,
# members-only, or region-locked videos). Export it from your browser with an
# extension such as "Get cookies.txt LOCALLY". Overridden by --cookies.
# cookies = "~/.config/blasphemy-killer/cookies.txt"

[processing]
extensions = [
    # video
    ".mp4", ".mkv", ".m4v", ".mov", ".avi", ".webm", ".ts",
    # audio
    ".mp3", ".m4a", ".flac", ".ogg", ".opus", ".wav",
]
write_report = true   # write a <file>.bk.json sidecar describing what was muted
keep_backup = false   # keep the original as <file>.bak instead of deleting it
