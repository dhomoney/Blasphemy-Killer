[project]
name = "blasphemy-killer"
version = "2.2.1"
description = "Scan video files for phrases that take the Lord's name in vain and mute them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    "click>=8.1",
    # 2026.8.19 dropped the android_vr client, whose formats YouTube began
    # 403ing mid-download without a GVS PO token.
    "yt-dlp>=2026.8.19",
    # Solver scripts for YouTube's "n challenge"; needs a JS runtime (deno/node/bun/quickjs).
    "yt-dlp-ejs>=0.8.0",
    # Web UI (blasphemy-killer-serve).
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
blasphemy-killer = "blasphemy_killer.cli:main"
blasphemy-killer-serve = "blasphemy_killer.web.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blasphemy_killer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
